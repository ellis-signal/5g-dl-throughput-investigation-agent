<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>5G 下行吞吐调查 Agent</title><link rel="stylesheet" href="style.css"><style>body{padding:0 24px 48px}.agent-shell{max-width:1100px;margin:32px auto}.agent-head{margin-bottom:28px}.agent-head h1{font-size:30px;margin:10px 0}.agent-card{background:#11181c;border:1px solid #2d3f48;padding:22px;margin:16px 0}.agent-form{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.agent-form label{display:grid;gap:8px}.agent-form select,.agent-form button{background:#172328;color:#dfe9ec;border:1px solid #41616a;padding:10px;font-size:15px}.agent-form button{cursor:pointer;color:#4fd1a5}.agent-output{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.65 Consolas,monospace;color:#dfe9ec;margin-top:12px}.agent-muted{color:#a4b8bd;line-height:1.6}.agent-link{color:#5ad2e6}.agent-heading{font-size:17px;color:#4fd1a5}</style></head><body><main class="agent-shell"><div class="agent-head"><a class="agent-link" href="/">← 返回调查台</a><h1>5G 下行吞吐调查 Agent</h1><p class="agent-muted">选择模拟小区，查看模型的工具调用、证据和调查建议。</p></div><section class="agent-card"><form id="form" class="agent-form"><label>调查小区<select id="cell"><option>NR-CELL-1002</option><option>NR-CELL-1001</option><option>NR-CELL-1003</option><option>NR-CELL-1004</option><option>NR-CELL-1005</option><option>NR-CELL-1006</option><option>NR-CELL-1007</option><option>NR-CELL-1008</option><option>NR-CELL-1009</option><option>NR-CELL-1010</option></select></label><label>调查问题<input id="question" value="请调查小区下行吞吐下降，比较覆盖、干扰和拥塞的证据。" style="background:#172328;color:#dfe9ec;border:1px solid #41616a;padding:10px;width:min(420px,80vw)"></label><button id="submit">开始调查</button></form><p class="agent-muted" id="status">模型及后端需要在本机运行。数据为模拟样例；调查结果包含候选方向和人工核查建议。</p></section><section class="agent-card"><h2 class="agent-heading">调查过程和工具返回</h2><div class="agent-output" id="trace">等待调查</div></section><section class="agent-card"><h2 class="agent-heading">证据核对结果</h2><div class="agent-output" id="answer">等待调查</div></section></main><script>
const form=document.querySelector('#form');form.addEventListener('submit',async e=>{e.preventDefault();let status=document.querySelector('#status'),trace=document.querySelector('#trace'),answer=document.querySelector('#answer'),button=document.querySelector('#submit');button.disabled=true;status.textContent='正在调用模型和调查工具…';trace.textContent='调查中';answer.textContent='等待结果';try{let response=await fetch('/api/agent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:document.querySelector('#cell').value,question:document.querySelector('#question').value})});let data=await response.json();if(!response.ok)throw new Error(data.detail||response.status);trace.textContent='问题：'+data.question+'\n\n'+data.trace.filter(x=>x.kind==='tool').map(x=>'工具 '+x.name+'\n参数 '+x.arguments+'\n返回 '+JSON.stringify(x.result,null,2)).join('\n\n');const result = data.review;
const names = { COVERAGE: '覆盖变化', INTERFERENCE: '干扰线索', CONGESTION: '资源竞争', NORMAL: '无显著下降', INSUFFICIENT: '证据不足' };
const metrics = Object.entries(result.evidence).map(([id, item]) =>
  id + '  ' + item.metric + '  ' + (item.value == null ? '缺失' : Number(item.value.toFixed(2))));
const checks = Object.entries(result.hypotheses).map(([label, items]) =>
  names[label] + '  ' + items.map(item => item.evidence + ' ' + item.status).join(' · '));
answer.textContent = [names[result.label], result.reason, '', ...metrics, '', ...checks, '', result.next_step].join('\n');status.textContent='调查完成，用时 '+data.seconds+' 秒。已加载诊断 Skill 并核对证据。';}catch(err){status.textContent='调查失败：'+err.message;trace.textContent='无调查结果';}finally{button.disabled=false;}});
</script></body></html>
